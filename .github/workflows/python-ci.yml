name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask werkzeug pymongo

      - name: Compile Python source
        run: python -m compileall -q project

      - name: Smoke import app modules
        run: |
          python - <<'PY'
          import pathlib
          import sys

          project_dir = pathlib.Path('project').resolve()
          sys.path.insert(0, str(project_dir))

          import web_app  # noqa: F401
          import admin_app  # noqa: F401
          import relief_system  # noqa: F401
          import request_queue  # noqa: F401
          import db  # noqa: F401

          print('Module imports successful')
          PY
